<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Tallying System - Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin-login.css">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Inter', sans-serif;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            padding: 30px;
            width: 100%;
            max-width: 420px;
        }
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .hidden {
            display: none !important;
        }
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 6px;
            color: #fff;
            font-weight: 500;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }
        .toast.success { background-color: #28a745; }
        .toast.error { background-color: #dc3545; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div id="toast" class="toast hidden"></div>

        <!-- VIEW 1: ADMIN PORTAL LOGIN -->
        <div id="login-view" class="auth-card">
            <div class="auth-header">
                <h2>Admin Portal Login</h2>
                <p>Enter your admin credentials to access the dashboard</p>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-username">Admin Username</label>
                    <input type="text" id="login-username" placeholder="Enter username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" placeholder="Enter password" required autocomplete="current-password">
                        <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('login-password', this)"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%; padding: 12px; margin-top: 10px;">Login to Dashboard</button>
            </form>

            <div class="auth-footer-links" style="display:flex; justify-content:space-between; margin-top:20px;">
                <a href="#" onclick="switchView('register-view')">Create Account</a>
                <a href="forgot-password.html">Forgot Password?</a>
            </div>
        </div>

        <!-- VIEW 2: CREATE ACCOUNT -->
        <div id="register-view" class="auth-card hidden">
            <div class="auth-header">
                <h2>Create Account</h2>
                <p>Set up a new admin profile</p>
            </div>

            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="reg-username">Choose Username</label>
                    <input type="text" id="reg-username" placeholder="Choose a username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" placeholder="Enter your email" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-password" placeholder="Create password" required autocomplete="new-password">
                        <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('reg-password', this)"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-success" style="width:100%; padding: 12px; margin-top: 10px;">Register Admin Account</button>
            </form>

            <div class="auth-footer-links single" style="margin-top:20px; text-align:center;">
                <a href="#" onclick="switchView('login-view')">&larr; Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:3000/api'
            : 'https://your-production-backend-url.com/api';

        function switchView(viewId) {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('register-view').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
        }

        function togglePasswordVisibility(fieldId, icon) {
            const field = document.getElementById(fieldId);
            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                field.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${isError ? 'error' : 'success'}`;
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 4000);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch(`${API_BASE}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await res.json();
                if (result.success) {
                    localStorage.setItem('tts_admin_logged_in', 'true');
                    localStorage.setItem('tts_admin_id', result.adminId);
                    localStorage.setItem('tts_admin_username', result.username);
                    showToast('Login successful! Redirecting...');
                    setTimeout(() => { window.location.href = 'admin-dashboard.html'; }, 1000);
                } else {
                    showToast(result.error || 'Invalid credentials.', true);
                }
            } catch (err) {
                showToast('Network error connecting to server.', true);
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;

            try {
                const res = await fetch(`${API_BASE}/admin/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const result = await res.json();
                if (result.success) {
                    showToast('Admin account created successfully! Please log in.');
                    switchView('login-view');
                } else {
                    showToast(result.error || 'Registration failed.', true);
                }
            } catch (err) {
                showToast('Network error connecting to server.', true);
            }
        }
    </script>
</body>
</html>
