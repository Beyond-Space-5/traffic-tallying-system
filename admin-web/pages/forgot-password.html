<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Traffic Tallying System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .auth-card { background: #ffffff; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); padding: 30px; width: 100%; max-width: 420px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #333; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #1d6fa5; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn:hover { background: #15527a; }
        .toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 6px; color: #fff; font-weight: 500; z-index: 1000; }
        .toast.success { background-color: #28a745; }
        .toast.error { background-color: #dc3545; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="toast" class="toast hidden"></div>
    <div class="auth-card">
        <div style="text-align: center; margin-bottom: 24px;">
            <h2>Reset Password</h2>
            <p style="color: #666; font-size: 14px;">Enter your registered email or username to receive a 6-digit code</p>
        </div>
        <form onsubmit="handleForgotPassword(event)">
            <div class="form-group">
                <label for="identifier">Username or Email Address</label>
                <input type="text" id="identifier" placeholder="Enter your email address" required>
            </div>
            <button type="submit" class="btn">Send Reset Code</button>
        </form>
        <div style="text-align: center; margin-top: 20px;">
            <a href="admin-login.html" style="color: #1d6fa5; text-decoration: none; font-size: 14px;">&larr; Back to Login</a>
        </div>
    </div>

    <script>
        // Use relative path so it automatically works locally and on Render production
        const API_BASE = '/api';

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast ${isError ? 'error' : 'success'}`;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 4000);
        }

        async function handleForgotPassword(e) {
            e.preventDefault();
            const identifier = document.getElementById('identifier').value.trim();
            
            // Save identifier for later steps
            localStorage.setItem('tts_reset_identifier', identifier);

            try {
                const response = await fetch(`${API_BASE}/admin/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier })
                });

                const result = await response.json();

                if (result.success) {
                    if (result.debugCode) {
                        showToast(`Reset Code (Local Debug): ${result.debugCode}`);
                        localStorage.setItem('tts_debug_code', result.debugCode);
                    } else {
                        showToast('Reset code sent successfully!');
                    }

                    // Wait 2 seconds so the toast shows the message before redirecting
                    setTimeout(() => {
                        window.location.href = 'email-code.html';
                    }, 2000);
                } else {
                    showToast(result.error || 'Failed to send reset code.', true);
                }
            } catch (err) {
                console.error('Error:', err);
                showToast('Network error connecting to server.', true);
            }
        }
    </script>
</body>
</html>
