<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Traffic Tallying System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { 
            background-color: #f4f7f6; 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .auth-card { 
            background: #ffffff; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
            padding: 30px; 
            width: 100%; 
            max-width: 420px; 
        }
        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-header h2 {
            color: #2b3e50;
            margin-bottom: 8px;
        }
        .auth-header p {
            color: #666;
            font-size: 14px;
        }
        .form-group { 
            margin-bottom: 20px; 
            position: relative;
        }
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 500; 
            color: #333; 
        }
        .form-group input { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            font-size: 14px; 
            box-sizing: border-box; 
        }
        .password-wrapper {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
        }
        .btn { 
            width: 100%; 
            padding: 12px; 
            background: #1d6fa5; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        .btn:hover { 
            background: #15527a; 
        }
        .toast { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            padding: 12px 20px; 
            border-radius: 6px; 
            color: #fff; 
            font-weight: 500; 
            z-index: 1000; 
            transition: opacity 0.3s ease;
        }
        .toast.success { background-color: #28a745; }
        .toast.error { background-color: #dc3545; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="toast" class="toast hidden"></div>
    <div class="auth-card">
        <div class="auth-header">
            <h2>Set New Password</h2>
            <p>Enter and confirm your new secure password</p>
        </div>
        
        <form id="reset-password-form" onsubmit="handleResetPassword(event)">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <div class="password-wrapper">
                    <input type="password" id="newPassword" placeholder="Enter new password" required>
                    <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('newPassword', this)"></i>
                </div>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                    <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)"></i>
                </div>
            </div>
            
            <button type="submit" class="btn">Update Password</button>
        </form>
    </div>

    <script>
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:3000/api'
            : 'https://your-production-backend-url.com/api';

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast ${isError ? 'error' : 'success'}`;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 4000);
        }

        function togglePasswordVisibility(fieldId, icon) {
            const field = document.getElementById(fieldId);
            if (field.type === 'password') {
                field.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                field.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        async function handleResetPassword(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const identifier = localStorage.getItem('tts_reset_identifier');
            const code = localStorage.getItem('tts_verified_code');

            if (!identifier || !code) {
                showToast('Authentication session missing. Please start over.', true);
                setTimeout(() => { window.location.assign('forgot-password.html'); }, 1500);
                return;
            }

            if (newPassword !== confirmPassword) {
                showToast('Passwords do not match. Please try again.', true);
                return;
            }

            if (newPassword.length < 6) {
                showToast('Password must be at least 6 characters long.', true);
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/admin/reset-password-confirmed`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, code, newPassword })
                });
                const result = await res.json();
                
                if (result.success) {
                    showToast('Password updated successfully! Redirecting...');
                    
                    localStorage.removeItem('tts_reset_identifier');
                    localStorage.removeItem('tts_verified_code');
                    
                    // Force immediate browser location assignment to admin-login.html
                    window.location.assign('admin-login.html');
                } else {
                    showToast(result.error || 'Failed to update password in database.', true);
                }
            } catch (err) {
                showToast('Network error connecting to server.', true);
            }
        }
    </script>
</body>
</html>
