<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Tallying System - Admin Configuration</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/admin-configuration.css">
    <style>
        .toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            padding: 16px 28px;
            border-radius: 6px;
            color: #fff;
            font-weight: 600;
            font-size: 1.1rem;
            min-width: 280px;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
            transition: opacity 0.6s ease-in-out, visibility 0.6s ease-in-out;
            opacity: 1;
            visibility: visible;
        }
        .toast.success { background-color: var(--success-color, #28a745); }
        .toast.error { background-color: var(--danger-color, #dc3545); }
        .toast.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="toast" class="toast hidden"></div>

        <!-- TOP NAVIGATION BAR -->
        <header class="top-navbar">
            <div class="nav-brand">
                <i class="fa-solid fa-traffic-light"></i>
                <span>Admin Configuration</span>
            </div>
            <div class="nav-actions">
                <!-- Fixed link matching admin-dashboard.html (with hyphen) -->
                <a href="admin-dashboard.html" class="btn btn-outline btn-sm">
                    <i class="fa-solid fa-chart-pie"></i> Dashboard
                </a>
            </div>
        </header>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">
            <!-- SECTION 1: ANALYTICS INTERVAL CONFIGURATION -->
            <section class="config-section">
                <div class="section-header-simple">
                    <h2>Analytics Interval</h2>
                    <p>Set the traffic data grouping interval in minutes.</p>
                </div>
                <div class="config-box">
                    <form id="interval-form" onsubmit="handleSaveInterval(event)">
                        <div class="inline-group">
                            <label for="analytics-interval">Interval (Minutes):</label>
                            <input type="number" id="analytics-interval" min="1" max="1440" value="15" required class="input-number">
                            <button type="submit" class="btn btn-success btn-sm">Save</button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- SECTION 2: TALLIER MANAGEMENT -->
            <section class="config-section">
                <div class="section-header-simple flex-row">
                    <div>
                        <h2>Tallier Accounts</h2>
                        <p>Manage individual tallier credentials and locations.</p>
                    </div>
                    <button class="btn btn-primary btn-sm" onclick="openTallierModal()">
                        <i class="fa-solid fa-plus"></i> Add Tallier
                    </button>
                </div>

                <div class="table-container">
                    <table class="simple-table">
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Password</th>
                                <th>Location</th>
                                <th>Status</th>
                                <th>Last Sync</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="talliers-table-body">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- CREATE TALLIER MODAL -->
    <div id="tallier-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3 id="modal-title">Create New Tallier</h3>
            <form id="tallier-form" onsubmit="handleSaveTallier(event)">
                <input type="hidden" id="edit-tallier-id">
                <div class="form-group">
                    <label for="tallier-username">Username</label>
                    <input type="text" id="tallier-username" placeholder="e.g. Tallier_001" required>
                </div>
                <div class="form-group" id="password-group">
                    <label for="tallier-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="tallier-password" placeholder="Password" required>
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('tallier-password', this)">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="tallier-location">Location</label>
                    <input type="text" id="tallier-location" placeholder="e.g. Junction A" required>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn btn-outline btn-sm" onclick="closeTallierModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api';

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch(`${API_BASE}/config`);
                const data = await res.json();
                if (data.interval) {
                    document.getElementById('analytics-interval').value = data.interval;
                }
            } catch (err) {
                console.error('Failed to load interval from backend.', err);
            }
            renderTalliersTable();
        });

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${isError ? 'error' : 'success'}`;
            setTimeout(() => { toast.classList.add('hidden'); }, 4000);
        }

        function togglePasswordVisibility(fieldId, btn) {
            const input = document.getElementById(fieldId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        async function handleSaveInterval(e) {
            e.preventDefault();
            const interval = parseInt(document.getElementById('analytics-interval').value);
            try {
                const res = await fetch(`${API_BASE}/config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ interval })
                });
                const result = await res.json();
                if (result.success) showToast(`Interval set to ${interval} minutes.`);
            } catch (err) {
                showToast('Error saving interval.', true);
            }
        }

        async function renderTalliersTable() {
            try {
                const res = await fetch(`${API_BASE}/talliers`);
                const data = await res.json();
                const tbody = document.getElementById('talliers-table-body');
                tbody.innerHTML = '';

                if (!data.success || !data.talliers || data.talliers.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted" style="padding: 24px;">No tallier accounts created yet.</td></tr>`;
                    return;
                }

                data.talliers.forEach(t => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${t.username}</strong></td>
                        <td><code>${t.password}</code></td>
                        <td>${t.location}</td>
                        <td><span class="badge ${t.active ? 'badge-success' : 'badge-danger'}">${t.active ? 'Active' : 'Inactive'}</span></td>
                        <td class="text-muted">${t.last_sync}</td>
                        <td>
                            <div class="action-links">
                                <button type="button" class="text-btn text-warning" onclick="toggleStatus(${t.id})">${t.active ? 'Deactivate' : 'Activate'}</button>
                                <button type="button" class="text-btn text-danger" onclick="deleteTallier(${t.id}, '${t.username}')">Delete</button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error('Error fetching talliers:', err);
            }
        }

        function openTallierModal() {
            document.getElementById('tallier-modal').classList.remove('hidden');
            document.getElementById('tallier-form').reset();
        }

        function closeTallierModal() {
            document.getElementById('tallier-modal').classList.add('hidden');
        }

        async function handleSaveTallier(e) {
            e.preventDefault();
            const username = document.getElementById('tallier-username').value.trim();
            const password = document.getElementById('tallier-password').value;
            const location = document.getElementById('tallier-location').value.trim();

            try {
                const res = await fetch(`${API_BASE}/talliers`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, location })
                });
                const result = await res.json();
                if (result.success) {
                    showToast(`Tallier ${username} saved successfully.`);
                    closeTallierModal();
                    renderTalliersTable();
                } else {
                    showToast('Failed to save tallier.', true);
                }
            } catch (err) {
                showToast('Network error saving tallier.', true);
            }
        }

        async function toggleStatus(id) {
            try {
                await fetch(`${API_BASE}/talliers/${id}/toggle`, { method: 'POST' });
                renderTalliersTable();
            } catch (err) { console.error(err); }
        }

        async function deleteTallier(id, username) {
            if (confirm(`Delete tallier "${username}"?`)) {
                try {
                    await fetch(`${API_BASE}/talliers/${id}`, { method: 'DELETE' });
                    renderTalliersTable();
                    showToast(`Tallier ${username} deleted.`);
                } catch (err) { console.error(err); }
            }
        }
    </script>
</body>
</html>
