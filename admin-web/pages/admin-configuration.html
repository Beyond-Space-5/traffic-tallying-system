<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Tallying System - Admin Configuration</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/admin-configuration.css">
</head>
<body>
    <div class="app-container">
        <!-- Toast Notification Box -->
        <div id="toast" class="toast hidden"></div>

        <!-- TOP NAVIGATION BAR -->
        <header class="top-navbar">
            <div class="nav-brand">
                <i class="fa-solid fa-traffic-light"></i>
                <span>Admin Configuration</span>
            </div>
            <div class="nav-actions">
                <a href="admin_dashboard.html" class="btn btn-outline btn-sm">Dashboard</a>
                <a href="admin_analytics.html" class="btn btn-primary btn-sm">Analytics</a>
            </div>
        </header>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">
            <!-- SECTION 1: ANALYTICS INTERVAL CONFIGURATION -->
            <section class="config-section">
                <div class="section-header-simple">
                    <h2>Analytics Interval</h2>
                    <p>Set the traffic data grouping interval in minutes.</p>
                </div>
                <div class="config-box">
                    <form id="interval-form" onsubmit="handleSaveInterval(event)">
                        <div class="inline-group">
                            <label for="analytics-interval">Interval (Minutes):</label>
                            <input type="number" id="analytics-interval" min="1" max="1440" value="15" required class="input-number">
                            <button type="submit" class="btn btn-success btn-sm">Save</button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- SECTION 2: TALLIER MANAGEMENT -->
            <section class="config-section">
                <div class="section-header-simple flex-row">
                    <div>
                        <h2>Tallier Accounts</h2>
                        <p>Manage individual tallier credentials and locations.</p>
                    </div>
                    <button class="btn btn-primary btn-sm" onclick="openTallierModal()">
                        <i class="fa-solid fa-plus"></i> Add Tallier
                    </button>
                </div>

                <div class="table-container">
                    <table class="simple-table">
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Location</th>
                                <th>Status</th>
                                <th>Last Sync</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="talliers-table-body">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- CREATE / EDIT TALLIER MODAL -->
    <div id="tallier-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3 id="modal-title">Create New Tallier</h3>
            <form id="tallier-form" onsubmit="handleSaveTallier(event)">
                <input type="hidden" id="edit-tallier-id">
                <div class="form-group">
                    <label for="tallier-username">Username</label>
                    <input type="text" id="tallier-username" placeholder="e.g. Tallier_001" required>
                </div>
                <div class="form-group" id="password-group">
                    <label for="tallier-password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="tallier-password" placeholder="Password" required>
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('tallier-password', this)">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="tallier-location">Location</label>
                    <input type="text" id="tallier-location" placeholder="e.g. Junction A" required>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn btn-outline btn-sm" onclick="closeTallierModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- RESET PASSWORD MODAL -->
    <div id="reset-password-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Reset Password</h3>
            <p class="modal-sub text-muted" style="font-size:0.875rem; margin-bottom:12px;">Set a new password for <span id="reset-target-name" class="font-bold"></span>.</p>
            <form onsubmit="handleExecutePasswordReset(event)">
                <input type="hidden" id="reset-tallier-id">
                <div class="form-group">
                    <label for="new-tallier-password">New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="new-tallier-password" placeholder="New password" required>
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('new-tallier-password', this)">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn btn-outline btn-sm" onclick="closeResetModal()">Cancel</button>
                    <button type="submit" class="btn btn-success btn-sm">Update</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api';

        // Initialize local storage defaults for talliers
        if (!localStorage.getItem('tts_talliers')) {
            localStorage.setItem('tts_talliers', JSON.stringify([]));
        }

        // Fetch interval from backend on load
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch(`${API_BASE}/config`);
                const data = await res.json();
                if (data.interval) {
                    document.getElementById('analytics-interval').value = data.interval;
                }
            } catch (err) {
                console.error('Failed to load interval from backend, using default.', err);
            }
            renderTalliersTable();
        });

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${isError ? 'error' : 'success'}`;
            setTimeout(() => { toast.classList.add('hidden'); }, 3000);
        }

        function togglePasswordVisibility(fieldId, btn) {
            const input = document.getElementById(fieldId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        async function handleSaveInterval(e) {
            e.preventDefault();
            const interval = parseInt(document.getElementById('analytics-interval').value);
            if (interval <= 0) {
                showToast('Interval must be at least 1 minute.', true);
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ interval })
                });
                const result = await res.json();
                if (result.success) {
                    showToast(`Interval updated to ${interval} minutes on backend.`);
                } else {
                    showToast('Failed to update interval on backend.', true);
                }
            } catch (err) {
                console.error('Network error updating interval:', err);
                showToast('Network error saving interval.', true);
            }
        }

        function renderTalliersTable() {
            const talliers = JSON.parse(localStorage.getItem('tts_talliers')) || [];
            const tbody = document.getElementById('talliers-table-body');
            tbody.innerHTML = '';

            if (talliers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted" style="padding: 24px;">No tallier accounts created yet. Click "Add Tallier" to start.</td></tr>`;
                return;
            }

            talliers.forEach(t => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${t.username}</strong></td>
                    <td>${t.location}</td>
                    <td><span class="badge ${t.active ? 'badge-success' : 'badge-danger'}">${t.active ? 'Active' : 'Inactive'}</span></td>
                    <td class="text-muted">${t.lastSync}</td>
                    <td>
                        <div class="action-links">
                            <button type="button" class="text-btn text-primary" onclick="editTallier('${t.id}')">Edit</button>
                            <button type="button" class="text-btn text-dark" onclick="openResetModal('${t.id}', '${t.username}')">Reset</button>
                            <button type="button" class="text-btn ${t.active ? 'text-warning' : 'text-success'}" onclick="toggleTallierStatus('${t.id}')">${t.active ? 'Deactivate' : 'Activate'}</button>
                            <button type="button" class="text-btn text-danger" onclick="deleteTallier('${t.id}', '${t.username}')">Delete</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openTallierModal(isEdit = false) {
            document.getElementById('tallier-modal').classList.remove('hidden');
            if (!isEdit) {
                document.getElementById('modal-title').textContent = 'Create New Tallier';
                document.getElementById('tallier-form').reset();
                document.getElementById('edit-tallier-id').value = '';
                document.getElementById('password-group').style.display = 'block';
                document.getElementById('tallier-password').setAttribute('required', 'required');
            }
        }

        function closeTallierModal() {
            document.getElementById('tallier-modal').classList.add('hidden');
        }

        function handleSaveTallier(e) {
            e.preventDefault();
            const id = document.getElementById('edit-tallier-id').value;
            const username = document.getElementById('tallier-username').value.trim();
            const location = document.getElementById('tallier-location').value.trim();
            const password = document.getElementById('tallier-password').value;

            let talliers = JSON.parse(localStorage.getItem('tts_talliers')) || [];

            if (id) {
                talliers = talliers.map(t => t.id === id ? { ...t, username, location } : t);
                showToast(`Tallier ${username} updated.`);
            } else {
                talliers.push({
                    id: Date.now().toString(),
                    username,
                    location,
                    active: true,
                    lastSync: 'Never',
                    password: password || 'password123'
                });
                showToast(`Tallier ${username} created.`);
            }

            localStorage.setItem('tts_talliers', JSON.stringify(talliers));
            closeTallierModal();
            renderTalliersTable();
        }

        function editTallier(id) {
            const talliers = JSON.parse(localStorage.getItem('tts_talliers')) || [];
            const t = talliers.find(item => item.id === id);
            if (!t) return;

            openTallierModal(true);
            document.getElementById('modal-title').textContent = 'Edit Tallier';
            document.getElementById('edit-tallier-id').value = t.id;
            document.getElementById('tallier-username').value = t.username;
            document.getElementById('tallier-location').value = t.location;
            document.getElementById('password-group').style.display = 'none';
            document.getElementById('tallier-password').removeAttribute('required');
        }

        function toggleTallierStatus(id) {
            let talliers = JSON.parse(localStorage.getItem('tts_talliers')) || [];
            talliers = talliers.map(t => {
                if (t.id === id) {
                    t.active = !t.active;
                    showToast(`Tallier ${t.username} ${t.active ? 'activated' : 'deactivated'}.`);
                }
                return t;
            });
            localStorage.setItem('tts_talliers', JSON.stringify(talliers));
            renderTalliersTable();
        }

        function deleteTallier(id, username) {
            if (confirm(`Delete tallier "${username}"?`)) {
                let talliers = JSON.parse(localStorage.getItem('tts_talliers')) || [];
                talliers = talliers.filter(t => t.id !== id);
                localStorage.setItem('tts_talliers', JSON.stringify(talliers));
                renderTalliersTable();
                showToast(`Tallier ${username} deleted.`);
            }
        }

        function openResetModal(id, username) {
            document.getElementById('reset-tallier-id').value = id;
            document.getElementById('reset-target-name').textContent = username;
            document.getElementById('new-tallier-password').value = '';
            document.getElementById('reset-password-modal').classList.remove('hidden');
        }

        function closeResetModal() {
            document.getElementById('reset-password-modal').classList.add('hidden');
        }

        function handleExecutePasswordReset(e) {
            e.preventDefault();
            const id = document.getElementById('reset-tallier-id').value;
            const newPass = document.getElementById('new-tallier-password').value;

            let talliers = JSON.parse(localStorage.getItem('tts_talliers')) || [];
            talliers = talliers.map(t => {
                if (t.id === id) t.password = newPass;
                return t;
            });

            localStorage.setItem('tts_talliers', JSON.stringify(talliers));
            closeResetModal();
            showToast('Password reset successful.');
        }
    </script>
</body>
</html>
