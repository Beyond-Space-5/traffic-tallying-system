<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talliers Login</title>
    <link rel="stylesheet" href="../css/tallier-login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="../manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('../sw.js')
          .then(() => console.log('Service Worker Registered'));
      }
    </script>
</head>
<body>

    <div class="login-container">
        <h1>Talliers Login</h1>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="off" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" required>
                    <i class="fa-regular fa-eye" id="togglePassword"></i>
                </div>
            </div>

            <button type="submit" class="login-btn">Log In</button>
        </form>
    </div>

    <script>
        // Use relative path so it automatically works locally and on Render production
        const API_BASE = '/api';

        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');

        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        }); 

        const loginForm = document.querySelector('#loginForm');
        loginForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = document.querySelector('#username').value.trim();
            const passwordVal = document.querySelector('#password').value;

            try {
                const response = await fetch(`${API_BASE}/tallier/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password: passwordVal })
                });

                const result = await response.json();
                if (result.success) {
                    localStorage.setItem('username', result.username);
                    window.location.href = 'tallier_configuration.html';
                } else {
                    alert(result.error || 'Login failed.');
                }
            } catch (err) {
                console.error('Network error during login:', err);
                alert('Could not connect to server.');
            }
        });
    </script>
</body>
</html>
