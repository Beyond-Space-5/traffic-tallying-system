<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tally Analytics & Results Dashboard</title>
    <!-- Correct stylesheet path pointing to tallier_analytics.css -->
    <link rel="stylesheet" href="../css/tallier_analytics.css">
    <!-- Chart.js CDN for visualising tally results -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="dashboard-container">
    <!-- Header Row -->
    <div class="header-row">
        <h2>Analytics Dashboard</h2>
        <div class="nav-btn-group">
            <a href="tallier_tally.html" class="btn btn-secondary">Back to Tally</a>
            <a href="tallier_configuration.html" class="btn btn-primary">Dashboard</a>
        </div>
    </div>

    <!-- Toolbar Row -->
    <div class="toolbar-row">
        <span class="subtitle" id="userSubtitle">Viewing submitted traffic counts for: <span id="displayUsername"></span></span>
        <button class="btn btn-danger" onclick="clearAnalyticsData()">🗑️ Clear My Records</button>
    </div>

    <!-- Detailed Analytics Table Section -->
    <div class="card table-card">
        <div class="table-responsive">
            <table class="analytics-table" id="analyticsTable">
                <thead>
                    <tr>
                        <th>Junction</th>
                        <th>Route</th>
                        <th>Vehicle Category</th>
                        <th>Time Interval</th>
                        <th style="text-align: right;">Total Count</th>
                    </tr>
                </thead>
                <tbody id="analyticsTableBody">
                    <tr>
                        <td colspan="5" class="placeholder-text">No tally records captured yet. Start recording counts on the tally page.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Analytics Chart Section -->
    <div class="card chart-card">
        <h3>Visual Breakdown by Route & Category</h3>
        <div class="chart-container">
            <canvas id="tallyChart"></canvas>
        </div>
    </div>
</div>

<script>
    // Username and storage keys matching tallier configuration and tally pages
    const username = localStorage.getItem('username') || 'guest';
    const countsStorageKey = `traffic_counts_${username}`;

    let tallyChartInstance = null;

    window.onload = function() {
        document.getElementById('displayUsername').textContent = username;
        loadAndDisplayAnalytics();
    };

    function loadAndDisplayAnalytics() {
        let records = [];
        try {
            records = JSON.parse(localStorage.getItem(countsStorageKey)) || [];
        } catch(e) {
            records = [];
        }

        const tbody = document.getElementById('analyticsTableBody');
        if (records.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="placeholder-text">No tally records captured yet. Start recording counts on the tally page.</td></tr>`;
            updateChart([]);
            return;
        }

        // Group records by Junction
        let groupedByJunction = {};
        records.forEach(rec => {
            const junction = rec.junction || 'Unknown Junction';
            if (!groupedByJunction[junction]) {
                groupedByJunction[junction] = [];
            }
            groupedByJunction[junction].push(rec);
        });

        let html = '';
        let overallTotal = 0;
        let junctionIndex = 1;

        for (const [junction, jRecords] of Object.entries(groupedByJunction)) {
            html += `
                <tr class="section-header-row">
                    <td colspan="5"><strong>${junctionIndex}. Junction: ${junction} | Route</strong></td>
                </tr>
            `;

            let junctionTotal = 0;
            jRecords.forEach(rec => {
                const count = rec.count || 0;
                junctionTotal += count;
                overallTotal += count;

                html += `
                    <tr>
                        <td style="text-align: center; width: 40px; color: #888;">↳</td>
                        <td><strong>${rec.route || 'N/A'}</strong></td>
                        <td>${rec.category || 'N/A'}</td>
                        <td>${rec.timeInterval || 'N/A'}</td>
                        <td style="text-align: right; color: #1d6fa5; font-weight: bold;">${count}</td>
                    </tr>
                `;
            });

            html += `
                <tr class="subtotal-row">
                    <td colspan="4" style="text-align: right; font-weight: bold;">Total Count:</td>
                    <td style="text-align: right; font-weight: bold; color: #333;">${junctionTotal}</td>
                </tr>
            `;
            junctionIndex++;
        }

        html += `
            <tr class="overall-total-row">
                <td colspan="4" style="text-align: right; font-weight: bold; font-size: 1.05em;">Overall Total Count:</td>
                <td style="text-align: right; font-weight: bold; font-size: 1.05em; color: #28a745;">${overallTotal}</td>
            </tr>
        `;

        tbody.innerHTML = html;
        updateChart(records);
    }

    function updateChart(records) {
        const ctx = document.getElementById('tallyChart').getContext('2d');

        if (records.length === 0) {
            if (tallyChartInstance) {
                tallyChartInstance.destroy();
                tallyChartInstance = null;
            }
            return;
        }

        const categories = [...new Set(records.map(r => r.category || 'Vehicle'))];
        const routes = [...new Set(records.map(r => r.route || 'Route'))];

        const colors = ['#1d6fa5', '#009688', '#8a2be2', '#e91e63', '#ff9800', '#4caf50'];

        const datasets = routes.map((route, index) => {
            const data = categories.map(cat => {
                const match = records.filter(r => (r.category || 'Vehicle') === cat && (r.route || 'Route') === route);
                return match.reduce((sum, curr) => sum + (curr.count || 0), 0);
            });
            return {
                label: route,
                data: data,
                backgroundColor: colors[index % colors.length],
                borderColor: colors[index % colors.length],
                borderWidth: 1
            };
        });

        if (tallyChartInstance) {
            tallyChartInstance.data.labels = categories;
            tallyChartInstance.data.datasets = datasets;
            tallyChartInstance.update();
        } else {
            tallyChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: categories,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { precision: 0 }
                        }
                    }
                }
            });
        }
    }

    function clearAnalyticsData() {
        if (confirm("Are you sure you want to clear your recorded analytics?")) {
            localStorage.removeItem(countsStorageKey);
            loadAndDisplayAnalytics();
            alert("Analytics records cleared.");
        }
    }
</script>

</body>
</html>
