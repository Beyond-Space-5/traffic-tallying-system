<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tally Analytics & Results Dashboard</title>
    <link rel="stylesheet" href="../css/tallier_analytics.css">
    <link rel="manifest" href="../manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('../sw.js')
          .then(() => console.log('Service Worker Registered'));
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="dashboard-container">
    <div class="header-row">
        <h2>Analytics Dashboard</h2>
        <div class="nav-btn-group">
            <a href="tallier_tally.html" class="btn btn-secondary">Back to Tally</a>
            <a href="tallier_configuration.html" class="btn btn-primary">Dashboard</a>
        </div>
    </div>

    <div class="toolbar-row">
        <span class="subtitle" id="userSubtitle">Viewing interval-aggregated traffic counts for: <span id="displayUsername" style="font-weight: bold; color: #1d6fa5;"></span> (Interval: <span id="displayInterval">15</span> mins)</span>
    </div>

    <div class="card table-card">
        <div class="table-responsive">
            <table class="analytics-table" id="analyticsTable">
                <thead>
                    <tr>
                        <th>Junction</th>
                        <th>Route</th>
                        <th>Vehicle Category</th>
                        <th>Time Interval</th>
                        <th style="text-align: right;">Aggregated Count</th>
                    </tr>
                </thead>
                <tbody id="analyticsTableBody">
                    <tr>
                        <td colspan="5" class="placeholder-text">Loading analytics from server...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bar Chart Card -->
    <div class="card chart-card">
        <h3>Visual Breakdown by Route & Category</h3>
        <div class="chart-container">
            <canvas id="tallyChart"></canvas>
        </div>
    </div>

    <!-- Interval-Aggregated Line Chart Card -->
    <div class="card chart-card" style="margin-top: 25px;">
        <h3>Vehicle Quantity vs. Time (Trendline by Category)</h3>
        <div class="chart-container">
            <canvas id="tallyLineChart"></canvas>
        </div>
    </div>
</div>

<script>
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
        ? 'http://localhost:3000/api'
        : 'https://your-production-backend-url.com/api';
    
    const urlParams = new URLSearchParams(window.location.search);
    const targetTallierId = urlParams.get('tallier_id') || localStorage.getItem('username') || 'guest';

    let tallyChartInstance = null;
    let tallyLineChartInstance = null;
    let configIntervalMinutes = 15;

    window.onload = async function() {
        document.getElementById('displayUsername').textContent = targetTallierId;
        
        try {
            const res = await fetch(`${API_BASE}/config`);
            const data = await res.json();
            if (data && data.interval) {
                configIntervalMinutes = Number(data.interval);
            }
        } catch (err) {
            console.error('Could not fetch interval from backend, using default 15 mins.', err);
        }
        
        document.getElementById('displayInterval').textContent = configIntervalMinutes;
        fetchAnalyticsFromServer();
    };

    async function fetchAnalyticsFromServer() {
        try {
            const response = await fetch(`${API_BASE}/tallies/${encodeURIComponent(targetTallierId)}`);
            const data = await response.json();
            if (data.success && data.records) {
                loadAndDisplayAnalytics(data.records);
            } else {
                loadAndDisplayAnalytics([]);
            }
        } catch (err) {
            console.error('Error fetching analytics from server:', err);
            loadAndDisplayAnalytics([]);
        }
    }

    function loadAndDisplayAnalytics(records) {
        const tbody = document.getElementById('analyticsTableBody');
        if (!records || records.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="placeholder-text">No tally records captured yet. Start recording counts on the tally page.</td></tr>`;
            updateChart([]);
            updateLineChart([]);
            return;
        }

        records.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

        let groupedByJunction = {};
        records.forEach(rec => {
            const junction = rec.junction || 'Unknown Junction';
            if (!groupedByJunction[junction]) groupedByJunction[junction] = [];
            groupedByJunction[junction].push(rec);
        });

        let html = '';
        let overallTotal = 0;
        let junctionIndex = 1;

        for (const [junction, jRecords] of Object.entries(groupedByJunction)) {
            html += `
                <tr class="section-header-row">
                    <td colspan="5" style="background-color: #eef2f7; color: #1d6fa5; font-weight: bold;"><strong>${junctionIndex}. Junction: ${junction}</strong></td>
                </tr>
            `;

            let intervalMs = configIntervalMinutes * 60 * 1000;
            let sessionStartTime = jRecords.length > 0 ? new Date(jRecords[0].timestamp).getTime() : Date.now();
            let intervalsMap = {};

            jRecords.forEach(rec => {
                const recTime = rec.timestamp ? new Date(rec.timestamp).getTime() : Date.now();
                const intervalIdx = Math.floor((recTime - sessionStartTime) / intervalMs);
                
                if (!intervalsMap[intervalIdx]) {
                    const intStart = new Date(sessionStartTime + (intervalIdx * intervalMs));
                    const intEnd = new Date(sessionStartTime + ((intervalIdx + 1) * intervalMs));
                    intervalsMap[intervalIdx] = {
                        label: `${intStart.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} - ${intEnd.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`,
                        aggregates: {}
                    };
                }

                const route = rec.route || 'N/A';
                const category = rec.category || 'N/A';
                const mapKey = `${route}__${category}`;
                const count = Number(rec.count || 0);

                if (!intervalsMap[intervalIdx].aggregates[mapKey]) {
                    intervalsMap[intervalIdx].aggregates[mapKey] = { route, category, count: 0 };
                }
                intervalsMap[intervalIdx].aggregates[mapKey].count += count;
            });

            let cumulativeRunningTotal = 0;
            let intervalKeys = Object.keys(intervalsMap).sort((a, b) => Number(a) - Number(b));

            intervalKeys.forEach((intKey) => {
                const intervalObj = intervalsMap[intKey];
                let intervalTotalCount = 0;

                for (const [mapKey, agg] of Object.entries(intervalObj.aggregates)) {
                    intervalTotalCount += agg.count;
                    overallTotal += agg.count;

                    html += `
                        <tr>
                            <td style="text-align: center; width: 40px; color: #888;">↳</td>
                            <td><strong>${agg.route}</strong></td>
                            <td>${agg.category}</td>
                            <td>${intervalObj.label}</td>
                            <td style="text-align: right; color: #1d6fa5; font-weight: bold;">${agg.count}</td>
                        </tr>
                    `;
                }

                cumulativeRunningTotal += intervalTotalCount;

                html += `
                    <tr style="background-color: #f1f5f9; font-weight: bold; border-top: 2px dashed #1d6fa5;">
                        <td colspan="4" style="text-align: right; color: #1d6fa5;">[${configIntervalMinutes}-Min Interval Summary - Cumulative Total]:</td>
                        <td style="text-align: right; color: #1d6fa5;">${cumulativeRunningTotal}</td>
                    </tr>
                `;
                html += `<tr style="height: 15px;"><td colspan="5" style="border: none; background: transparent;">&nbsp;</td></tr>`;
            });

            html += `<tr style="height: 10px;"><td colspan="5" style="border: none; background: transparent;">&nbsp;</td></tr>`;
            junctionIndex++;
        }

        html += `
            <tr class="overall-total-row">
                <td colspan="4" style="text-align: right; font-weight: bold; font-size: 1.05em;">Overall Total Count:</td>
                <td style="text-align: right; font-weight: bold; font-size: 1.05em; color: #28a745;">${overallTotal}</td>
            </tr>
        `;

        tbody.innerHTML = html;
        updateChart(records);
        updateLineChart(records);
    }

    function updateChart(records) {
        const ctx = document.getElementById('tallyChart').getContext('2d');
        if (!records || records.length === 0) {
            if (tallyChartInstance) { tallyChartInstance.destroy(); tallyChartInstance = null; }
            return;
        }

        const categories = [...new Set(records.map(r => r.category || 'Vehicle'))];
        const routes = [...new Set(records.map(r => r.route || 'Route'))];
        const colors = ['#1d6fa5', '#009688', '#8a2be2', '#e91e63', '#ff9800', '#4caf50'];

        const datasets = routes.map((route, index) => {
            const data = categories.map(cat => {
                const match = records.filter(r => (r.category || 'Vehicle') === cat && (r.route || 'Route') === route);
                return match.reduce((sum, curr) => sum + Number(curr.count || 0), 0);
            });
            return {
                label: route,
                data: data,
                backgroundColor: colors[index % colors.length],
                borderColor: colors[index % colors.length],
                borderWidth: 1
            };
        });

        if (tallyChartInstance) {
            tallyChartInstance.data.labels = categories;
            tallyChartInstance.data.datasets = datasets;
            tallyChartInstance.update();
        } else {
            tallyChartInstance = new Chart(ctx, {
                type: 'bar',
                data: { labels: categories, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
                }
            });
        }
    }

    function updateLineChart(records) {
        const ctx = document.getElementById('tallyLineChart').getContext('2d');
        if (!records || records.length === 0) {
            if (tallyLineChartInstance) { tallyLineChartInstance.destroy(); tallyLineChartInstance = null; }
            return;
        }

        const intervalMs = configIntervalMinutes * 60 * 1000;
        const sessionStartTime = new Date(records[0].timestamp).getTime();

        let intervalsMap = {};
        records.forEach(rec => {
            const recTime = rec.timestamp ? new Date(rec.timestamp).getTime() : Date.now();
            const intervalIdx = Math.floor((recTime - sessionStartTime) / intervalMs);
            
            if (!intervalsMap[intervalIdx]) {
                const intStart = new Date(sessionStartTime + (intervalIdx * intervalMs));
                const intEnd = new Date(sessionStartTime + ((intervalIdx + 1) * intervalMs));
                intervalsMap[intervalIdx] = {
                    label: `${intStart.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} - ${intEnd.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`,
                    counts: {}
                };
            }
            const cat = rec.category || 'Vehicle';
            const count = Number(rec.count || 0);
            intervalsMap[intervalIdx].counts[cat] = (intervalsMap[intervalIdx].counts[cat] || 0) + count;
        });

        const intervalKeys = Object.keys(intervalsMap).sort((a, b) => Number(a) - Number(b));
        const intervalLabels = intervalKeys.map(k => intervalsMap[k].label);
        const categories = [...new Set(records.map(r => r.category || 'Vehicle'))];
        const colors = ['#1d6fa5', '#28a745', '#dc3545', '#ffc107', '#6f42c1', '#20c997'];

        const datasets = categories.map((cat, index) => {
            let runningSum = 0;
            const data = intervalKeys.map(k => {
                const intervalCount = intervalsMap[k].counts[cat] || 0;
                runningSum += intervalCount;
                return runningSum;
            });

            return {
                label: cat,
                data: data,
                borderColor: colors[index % colors.length],
                backgroundColor: colors[index % colors.length],
                fill: false,
                tension: 0.1,
                borderWidth: 2
            };
        });

        if (tallyLineChartInstance) {
            tallyLineChartInstance.data.labels = intervalLabels;
            tallyLineChartInstance.data.datasets = datasets;
            tallyLineChartInstance.update();
        } else {
            tallyLineChartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels: intervalLabels, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, ticks: { precision: 0 }, title: { display: true, text: 'Cumulative Count' } },
                        x: { title: { display: true, text: 'Time Interval' } }
                    }
                }
            });
        }
    }
</script>

</body>
</html>
